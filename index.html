<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistencias — Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="ledger-card">
      <h1 class="brand-mark">Asistencias</h1>
      <p class="brand-sub">registro mensual de personal</p>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <p class="form-msg" id="msg"></p>
      <p class="login-foot">Acceso solo para administradores del registro.</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const msg = document.getElementById('msg');

    auth.onAuthStateChanged((user) => {
      if (user) window.location.href = 'dashboard.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        msg.textContent = 'No se pudo iniciar sesión. Revisa tu correo y contraseña.';
      }
    });
  </script>
</body>
</html>
